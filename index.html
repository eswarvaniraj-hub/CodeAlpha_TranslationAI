<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Language Translation Tool - CodeAlpha AI Internship Task 1">
    <title>AI Language Translation Tool | CodeAlpha</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background glow shapes -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="app-wrapper">
        <!-- Header -->
        <header class="app-header">
            <div class="brand-badge">
                <span class="badge-dot"></span>
                <span>CodeAlpha AI Internship • Task 1</span>
            </div>
            <h1 class="app-title">
                <span class="gradient-text">AI Language</span> Translation Tool
            </h1>
            <p class="app-subtitle">
                A modern, responsive translation interface ready for intelligent language processing.
            </p>
        </header>

        <!-- Main Translation Container -->
        <main class="translator-container">
            <!-- Language Controls Bar -->
            <div class="language-toolbar">
                <div class="select-wrapper">
                    <label for="source-language" class="visually-hidden">Source Language</label>
                    <select id="source-language" class="language-select" aria-label="Select source language">
                        <option value="auto">Detect Language</option>
                        <option value="en" selected>English</option>
                        <option value="ta">Tamil</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                        <option value="ml">Malayalam</option>
                        <option value="kn">Kannada</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>

                <button id="swap-lang-btn" class="icon-btn swap-btn" type="button" title="Swap languages" aria-label="Swap languages">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m16 3 4 4-4 4"/>
                        <path d="M20 7H4"/>
                        <path d="m8 21-4-4 4-4"/>
                        <path d="M4 17h16"/>
                    </svg>
                </button>

                <div class="select-wrapper">
                    <label for="target-language" class="visually-hidden">Target Language</label>
                    <select id="target-language" class="language-select" aria-label="Select target language">
                        <option value="ta" selected>Tamil</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                        <option value="ml">Malayalam</option>
                        <option value="kn">Kannada</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>
            </div>

            <!-- Translation Panels (Side-by-side or stacked on mobile) -->
            <div class="panels-grid">
                <!-- Source Input Panel -->
                <div class="panel-card source-panel">
                    <div class="panel-header">
                        <span class="panel-label">Input Text</span>
                        <button id="clear-input-btn" class="text-action-btn" type="button" title="Clear input">
                            Clear
                        </button>
                    </div>

                    <textarea
                        id="source-text"
                        class="translation-textarea"
                        placeholder="Type or paste text to translate here..."
                        maxlength="5000"
                        rows="7"
                    ></textarea>

                    <div class="panel-footer">
                        <div class="panel-tools">
                            <button id="listen-source-btn" class="tool-btn" type="button" title="Listen to source text" aria-label="Listen to source text">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                                </svg>
                                <span>Listen</span>
                            </button>
                            <button id="copy-source-btn" class="tool-btn" type="button" title="Copy source text" aria-label="Copy source text">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                                </svg>
                                <span>Copy</span>
                            </button>
                        </div>
                        <div class="char-counter">
                            <span id="char-count">0</span> / 5000
                        </div>
                    </div>
                </div>

                <!-- Target Output Panel -->
                <div class="panel-card target-panel">
                    <div class="panel-header">
                        <span class="panel-label">Translation</span>
                        <span id="status-badge" class="status-pill ready">Ready</span>
                    </div>

                    <textarea
                        id="target-text"
                        class="translation-textarea"
                        placeholder="Translation will appear here after API connection..."
                        readonly
                        rows="7"
                    ></textarea>

                    <div class="panel-footer">
                        <div class="panel-tools">
                            <button id="listen-target-btn" class="tool-btn" type="button" title="Listen to translation" aria-label="Listen to translation">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                                </svg>
                                <span>Listen</span>
                            </button>
                            <button id="copy-target-btn" class="tool-btn" type="button" title="Copy translation" aria-label="Copy translation">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                                </svg>
                                <span>Copy</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Translate Action Trigger -->
            <div class="action-bar">
                <button id="translate-btn" class="primary-btn" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m5 8 6 6"/>
                        <path d="m4 14 6-6 2-3"/>
                        <path d="M2 5h12"/>
                        <path d="M7 2h1"/>
                        <path d="m22 22-5-10-5 10"/>
                        <path d="M14 18h6"/>
                    </svg>
                    <span>Translate</span>
                </button>
            </div>

            <!-- User Notification / Toast Message -->
            <div id="toast-message" class="toast hidden" role="status" aria-live="polite"></div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>CodeAlpha AI Internship &bull; Task 1: Language Translation Tool (Initial Prototype)</p>
        </footer>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
